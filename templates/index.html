<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exam1 Todo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <main class="app">
        <section class="panel login-panel" id="loginPanel">
            <h1>Todo Login</h1>
            <form id="loginForm">
                <label for="uid">아이디</label>
                <input id="uid" name="uid" type="text" value="admin" autocomplete="username" required>

                <label for="upwd">비밀번호</label>
                <input id="upwd" name="upwd" type="password" value="1234" autocomplete="current-password" required>

                <button type="submit">로그인</button>
            </form>
            <p class="message" id="loginMessage"></p>
        </section>

        <section class="panel todo-panel hidden" id="todoPanel">
            <div class="topbar">
                <div>
                    <h1>할 일 관리</h1>
                    <p id="userInfo"></p>
                </div>
                <button type="button" class="secondary" id="logoutBtn">로그아웃</button>
            </div>

            <form id="todoForm" class="todo-form">
                <input id="todoTitle" type="text" placeholder="새 할 일을 입력하세요" required>
                <button type="submit">추가</button>
            </form>

            <p class="message" id="todoMessage"></p>
            <ul id="todoList" class="todo-list"></ul>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
